services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_NAME: "Selección de Aspirantes"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_LOCALE: es
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-aspirantes}
      DB_USERNAME: ${MYSQL_USER:-aspirantes}
      DB_PASSWORD: ${MYSQL_PASSWORD:-aspirantes}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aspirantes}
      MYSQL_USER: ${MYSQL_USER:-aspirantes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aspirantes}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) en lugar de localhost (socket): durante la inicialización
      # MySQL levanta un servidor temporal sin red, y no debe contar como "listo".
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
